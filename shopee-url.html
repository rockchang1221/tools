<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分潤短網址產生器後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 sm:p-8 flex items-center justify-center">

    <div class="max-w-2xl w-full glass-panel rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">🚀 專屬分潤連結產生器</h1>
            <p class="text-blue-100 mt-2 text-sm">將蝦皮連結轉為你的專屬防封鎖短網址</p>
        </div>

        <div class="p-6 sm:p-8 space-y-6">
            <!-- 系統設定區 (自動儲存於瀏覽器) -->
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                <h2 class="text-sm font-semibold text-slate-700 mb-3 flex justify-between items-center">
                    ⚙️ 系統設定 (只需設定一次)
                    <span class="text-xs text-green-600 bg-green-100 px-2 py-1 rounded-full hidden" id="saveHint">已自動儲存</span>
                </h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Google Apps Script URL (後端 API)</label>
                        <input type="text" id="gasUrl" value="https://script.google.com/macros/s/AKfycbxrmoKktdVXJJCNQ31poi5uhQsRkwbgy_-moJX9n4BAgkoZVNS2hChgv8VSd451ey4t/exec" placeholder="https://script.google.com/macros/s/.../exec" class="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">你的 GitHub Pages 跳轉頁網址 (Base URL)</label>
                        <input type="text" id="baseUrl" value="https://rockchang1221.github.io/shopeee.center/go.html" placeholder="https://你的帳號.github.io/go/" class="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                    </div>
                </div>
            </div>

            <!-- 產生連結區 -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">請貼上蝦皮分潤連結</label>
                <textarea id="shopeeUrl" rows="3" placeholder="https://shopee.tw/..." class="w-full text-sm px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition resize-none shadow-sm"></textarea>
            </div>

            <button id="generateBtn" onclick="generateLink()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 flex justify-center items-center shadow-lg shadow-blue-200 active:scale-[0.98]">
                <span>✨ 產生專屬短網址</span>
                <svg id="loadingIcon" class="hidden animate-spin ml-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>

            <!-- 結果顯示區 -->
            <div id="resultArea" class="hidden mt-6 bg-green-50 border border-green-200 rounded-xl p-5 transition-all">
                <p class="text-sm font-medium text-green-800 mb-2">🎉 建立成功！這是你要貼到社群的網址：</p>
                <div class="flex items-center gap-2">
                    <input type="text" id="finalUrl" readonly class="flex-1 bg-white border border-green-300 text-slate-800 text-sm rounded-lg px-3 py-2 outline-none">
                    <button onclick="copyToClipboard()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition active:scale-[0.95]">
                        複製
                    </button>
                </div>
            </div>
            
            <!-- 錯誤訊息區 -->
            <div id="errorArea" class="hidden mt-4 bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl text-sm">
            </div>
        </div>
    </div>

    <script>
        // 初始化：讀取儲存的設定
        document.addEventListener('DOMContentLoaded', () => {
            const savedGasUrl = localStorage.getItem('gasUrl');
            const savedBaseUrl = localStorage.getItem('baseUrl');
            if (savedGasUrl) document.getElementById('gasUrl').value = savedGasUrl;
            if (savedBaseUrl) document.getElementById('baseUrl').value = savedBaseUrl;

            // 綁定設定改變時自動儲存
            document.getElementById('gasUrl').addEventListener('input', saveSettings);
            document.getElementById('baseUrl').addEventListener('input', saveSettings);
        });

        function saveSettings() {
            localStorage.setItem('gasUrl', document.getElementById('gasUrl').value);
            localStorage.setItem('baseUrl', document.getElementById('baseUrl').value);
            const hint = document.getElementById('saveHint');
            hint.classList.remove('hidden');
            setTimeout(() => hint.classList.add('hidden'), 2000);
        }

        async function generateLink() {
            const gasUrl = document.getElementById('gasUrl').value.trim();
            const baseUrl = document.getElementById('baseUrl').value.trim();
            const shopeeUrl = document.getElementById('shopeeUrl').value.trim();
            const btn = document.getElementById('generateBtn');
            const loadingIcon = document.getElementById('loadingIcon');
            const resultArea = document.getElementById('resultArea');
            const errorArea = document.getElementById('errorArea');

            // 基本驗證
            if (!gasUrl || !baseUrl) {
                showError('請先完成上方的「系統設定」！');
                return;
            }
            if (!shopeeUrl) {
                showError('請貼上蝦皮連結！');
                return;
            }

            // 確保 BaseURL 結尾邏輯正確
            const finalBaseUrl = baseUrl.includes('?') ? baseUrl : baseUrl + '?id=';

            // UI 狀態切換
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            loadingIcon.classList.remove('hidden');
            resultArea.classList.add('hidden');
            errorArea.classList.add('hidden');

            try {
                // 發送請求到 Google Apps Script (使用 GET 並將參數編碼)
                const apiUrl = `${gasUrl}?action=create&url=${encodeURIComponent(shopeeUrl)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.success) {
                    const shortUrl = `${finalBaseUrl}${data.id}`;
                    document.getElementById('finalUrl').value = shortUrl;
                    resultArea.classList.remove('hidden');
                    document.getElementById('shopeeUrl').value = ''; // 清空輸入框
                } else {
                    showError('伺服器回傳錯誤：' + (data.error || '未知錯誤'));
                }
            } catch (err) {
                showError('連線失敗，請確認你的 GAS URL 是否正確且已授權。錯誤詳情: ' + err.message);
            } finally {
                // 還原 UI 狀態
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                loadingIcon.classList.add('hidden');
            }
        }

        function showError(msg) {
            const errorArea = document.getElementById('errorArea');
            errorArea.innerText = msg;
            errorArea.classList.remove('hidden');
        }

        function copyToClipboard() {
            const copyText = document.getElementById("finalUrl");
            copyText.select();
            copyText.setSelectionRange(0, 99999); // 手機相容
            try {
                document.execCommand("copy");
                alert("✅ 連結已複製！現在可以去社群貼文了。");
            } catch (err) {
                alert("複製失敗，請手動選取複製");
            }
        }
    </script>
</body>
</html>
