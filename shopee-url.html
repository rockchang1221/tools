<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專屬分潤連結產生器</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl overflow-hidden">
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold mb-2">🚀 專屬分潤連結產生器</h1>
            <p class="text-blue-100">將蝦皮連結轉為你的專屬防封鎖短網址</p>
        </div>
        
        <div class="p-6">
            <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 mb-6">
                <h2 class="text-sm font-bold text-gray-500 mb-4 flex items-center">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    系統設定 (只需設定一次)
                </h2>
                
                <div class="mb-4">
                    <label class="block text-sm text-gray-600 mb-1">Google Apps Script URL (後端 API)</label>
                    <input type="text" id="gasUrl" value="https://script.google.com/macros/s/AKfycbxrmoKktdVXJJCNQ31poi5uhQsRkwbgy_-moJX9n4BAgkoZVNS2hChgv8VSd451ey4t/exec" class="w-full p-2 border border-gray-300 rounded text-sm text-gray-500 focus:outline-none focus:border-blue-500">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-600 mb-1">你的 GitHub Pages 跳轉頁網址 (Base URL)</label>
                    <input type="text" id="baseUrl" value="https://rockchang1221.github.io/shopeee.center/go.html" class="w-full p-2 border border-gray-300 rounded text-sm text-gray-500 focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 font-bold mb-2">請貼上蝦皮分潤連結</label>
                <textarea id="urlInput" rows="3" placeholder="https://s.shopee.tw/..." class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"></textarea>
            </div>
            
            <button id="generateBtn" onclick="generateShortUrl()" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition-colors flex justify-center items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                產生專屬短網址
            </button>
            
            <div id="loading" class="hidden mt-4 text-center text-blue-600">
                <div class="animate-spin inline-block w-6 h-6 border-2 border-current border-t-transparent text-blue-600 rounded-full" role="status" aria-label="loading"></div>
                <span class="ml-2 align-middle">正在連線寫入資料庫...</span>
            </div>

            <div id="result" class="hidden mt-6 p-4 rounded-lg border text-center break-all">
                <!-- 結果會顯示在這裡 -->
            </div>
        </div>
    </div>

    <script>
        async function generateShortUrl() {
            const shopeeUrl = document.getElementById('urlInput').value.trim();
            const gasUrl = document.getElementById('gasUrl').value.trim();
            const baseUrl = document.getElementById('baseUrl').value.trim();
            const resultDiv = document.getElementById('result');
            const loadingDiv = document.getElementById('loading');
            const generateBtn = document.getElementById('generateBtn');

            if (!shopeeUrl) {
                alert("請輸入蝦皮連結！");
                return;
            }

            loadingDiv.classList.remove('hidden');
            generateBtn.disabled = true;
            generateBtn.classList.add('opacity-50', 'cursor-not-allowed');
            resultDiv.classList.add('hidden');

            try {
                // 【關鍵】將 POST 改為 GET，直接將網址編碼附加在 GAS URL 後方以避開 CORS 預檢
                const targetUrl = gasUrl + "?url=" + encodeURIComponent(shopeeUrl);
                
                const response = await fetch(targetUrl, {
                    method: "GET",
                    redirect: "follow"
                });
                
                const result = await response.json();
                
                if (result.success) {
                    const shortUrl = `${baseUrl}?id=${result.id}`;
                    
                    resultDiv.innerHTML = `
                        <div class="text-green-600 font-bold mb-2 text-lg">🎉 產生成功！你的專屬連結：</div>
                        <input type="text" value="${shortUrl}" readonly class="w-full p-3 bg-white border border-green-300 rounded mb-3 text-gray-800 font-medium text-center">
                        <button onclick="navigator.clipboard.writeText('${shortUrl}'); alert('已複製連結！');" class="bg-green-500 text-white font-bold px-4 py-3 rounded hover:bg-green-600 w-full transition-colors">
                            複製連結
                        </button>
                    `;
                    resultDiv.classList.remove('hidden', 'bg-red-50', 'border-red-200');
                    resultDiv.classList.add('bg-green-50', 'border-green-200');
                    
                    document.getElementById('urlInput').value = '';
                } else {
                    throw new Error(result.error || "GAS 回傳未知錯誤");
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="text-red-600 font-bold mb-1">❌ 連線失敗</div>
                    <div class="text-sm text-red-500 text-left">
                        <strong>可能原因：</strong><br>
                        1. GAS 尚未以「新增部署作業」的方式發布<br>
                        2. GAS 權限未設定為「所有人」<br>
                        <br>
                        <strong>錯誤詳情：</strong> ${error.message}
                    </div>
                `;
                resultDiv.classList.remove('hidden', 'bg-green-50', 'border-green-200');
                resultDiv.classList.add('bg-red-50', 'border-red-200');
            } finally {
                loadingDiv.classList.add('hidden');
                generateBtn.disabled = false;
                generateBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
